# 风险评分系统 — 生产环境反向代理
# 统一入口：
#   /         → H5 用户端 (risk-score-h5/dist)
#   /admin     → PC 后台管理端 (risk-admin/web/dist)
#   /api       → 后端服务 (risk-admin/server, 端口 3000)
#   /ws        → 后端 WebSocket (socket.io, 命名空间 /ws/admin/notify)

upstream risk_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name localhost;   # 部署时替换为实际域名

    # ============ H5 用户端 ============
    location / {
        root /srv/risk-score-h5/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ============ PC 后台管理端 ============
    location /admin {
        alias /srv/risk-admin-web/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ============ 后端 HTTP 接口 ============
    location /api {
        proxy_pass http://risk_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ WebSocket 实时同步 ============
    location /ws {
        proxy_pass http://risk_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
